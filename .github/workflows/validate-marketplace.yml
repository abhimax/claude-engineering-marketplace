name: Validate marketplace

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked development dependencies
        run: npm ci
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Run structural validation tests
        run: npm test
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Run shared structural and official validation
        run: ./scripts/validate-marketplace
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"